
services:
  # Jenkins CI/CD
    # Jenkins CI/CD with Docker support
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    image: custom-jenkins-docker:latest
    container_name: jenkins
    restart: unless-stopped
    user: "1000:1000"
    group_add:
      - "0"
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home_clean:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - devops-network

  # Nexus Repository Manager
  nexus:
    image: sonatype/nexus3:3.98.1-ubi
    container_name: nexus
    restart: unless-stopped
    ports:
      - "8082:8081"
    volumes:
      - nexus_data:/nexus-data
    networks:
      - devops-network

  # PostgreSQL for SonarQube
  postgres:
    image: postgres:15
    container_name: sonar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar_password
      POSTGRES_DB: sonar
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - devops-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 10

  # MySQL for Spring Boot
  mysql:
    image: mysql:8.0
    container_name: station-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: ski_db
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - devops-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Spring Boot application
  station-app:
    image: gestion-station-skii:1.0
    container_name: gestion-station-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8085:8087"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/ski_db?createDatabaseIfNotExist=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
    networks:
      - devops-network

  # SonarQube Code Quality
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar_password
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - devops-network

volumes:
  jenkins_home_clean:
  jenkins_home:
  nexus_data:
  postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  mysql_data:

networks:
  devops-network:
    driver: bridge
