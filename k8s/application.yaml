apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestion-station-skii
  namespace: gestion-station-skii
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gestion-station-skii
  template:
    metadata:
      labels:
        app: gestion-station-skii
    spec:
      containers:
        - name: app
          image: gestion-station-skii:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8087
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: password
          readinessProbe:
            httpGet:
              path: /stationSki/v3/api-docs
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /stationSki/v3/api-docs
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gestion-station-skii
  namespace: gestion-station-skii
spec:
  type: LoadBalancer
  selector:
    app: gestion-station-skii
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP